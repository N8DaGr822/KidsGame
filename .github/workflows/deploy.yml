name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish KidsGameLauncher.csproj -c Release -o publish

      # GitHub Pages serves this repo from /KidsGame/, not the root, so
      # the base href baked in for local dev (dotnet run at "/") needs to
      # point at the subpath or every asset request 404s.
      - name: Fix base href for the /KidsGame/ subpath
        run: sed -i 's#<base href="/" />#<base href="/KidsGame/" />#' publish/wwwroot/index.html

      # Pages runs output through Jekyll by default, which ignores
      # folders starting with "_" — that would drop Blazor's
      # _framework directory entirely.
      - name: Disable Jekyll processing
        run: touch publish/wwwroot/.nojekyll

      # Client-side routes (/games, /play/{id}, /admin) don't exist as
      # real files, so a hard refresh or deep link 404s on a static
      # host. Pages falls back to 404.html, so serve the SPA there too.
      - name: Add SPA fallback
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
